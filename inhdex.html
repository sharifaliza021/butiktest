<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ایران ویر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app"></div>
<script src="common.js"></script>
<script>
let D,cart=JSON.parse(localStorage.getItem('iw_cart')||'[]'),sel={c:0,s:0,t:0};
const $c=()=>localStorage.setItem('iw_cart',JSON.stringify(cart));
const wa=(t='')=>`https://wa.me/${D.shop.whatsapp}${t?'?text='+encodeURIComponent(t):''}`;
const nav=a=>`<nav class="nv">${[['ho','خانه','#/home'],['gr','محصولات','#/list/all'],['us','درباره ما','#/card'],['ch','تماس',wa()]].map(([i,t,h],k)=>`<a href="${h}" ${k==3?'target="_blank" rel="noopener"':''} class="${k==a?'on':''}" style="display:flex;flex-direction:column;align-items:center;font-size:10px;color:${k==a?'#e8b45a':'#8d8678'}">${ic(i,22)}${t}</a>`).join('')}</nav>`;
const chips=(arr,a)=>`<div class="chs">${arr.map(([h,t],i)=>`<a href="${h}" class="${i==a?'g':''}" style="padding:5px 13px;border-radius:9px;background:#15151a;border:1px solid #2a2a33;font-size:12px;white-space:nowrap">${t}</a>`).join('')}</div>`;
const top=(t,r='')=>`<div class="tp"><a href="javascript:history.back()" aria-label="بازگشت">${ic('cr',22)}</a><b>${esc(t)}</b><span>${r}</span></div>`;
const pc=p=>`<a class="pc" href="#/p/${esc(p.id)}"><div class="pi"><img src="${esc(p.image)}" alt="" style="width:100%;height:100%;object-fit:cover"><i>${ic('he',14)}</i></div><small>${esc(p.name)}</small><em>${money(p.price)}</em></a>`;
const soc=()=>[['ph','تماس','d','tel:'+D.shop.phone],['wa','واتساپ','w',wa()],['tg','تلگرام','t','https://t.me/'+D.shop.telegram],['ig','اینستاگرام','i','https://instagram.com/'+D.shop.instagram]].map(([i,t,c,h])=>`<a class="so ${c}" href="${esc(h)}" target="_blank" rel="noopener">${ic(i,24)}<small>${t}</small></a>`).join('');
const V={
splash:()=>`<a href="#/card" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:60px 24px 30px;background:radial-gradient(circle at 50% 25%,#2b2217,#0b0b0e 70%);min-height:100vh">${logo(1.6)}<div class="ct"><h2>استایل تو ، امضای شخصیته</h2><p>جدیدترین مدل‌ها | کیفیت بالا | ارسال سریع</p></div><div class="ct"><div class="nfc">${ic('nf',54,'#e8b45a',2)}<b>NFC</b></div><p class="go">کارت هوشمند | ارتباط سریع</p></div><div class="ft"><span>با نزدیک کردن گوشی به کارت NFC<br>وارد صفحه شوید</span>${ic('cr',24,'#e8b45a')}</div></a>`,
card:()=>{const s=D.shop;return `<div style="height:130px"><img src="${esc(s.cover)}" alt="" style="width:100%;height:100%;object-fit:cover"></div><div class="ct" style="margin-top:-46px;padding:0 16px"><div class="av">${logo(.55)}</div><h2 style="margin:8px 0 2px;font-size:26px">${esc(s.name)}</h2><p>${esc(s.desc)}</p><p style="font-size:12px">${esc(s.tagline)}</p></div><div class="r4">${soc()}</div><button class="gb" data-a="vc" style="margin:12px 16px 0">ذخیره شماره در مخاطبین</button><div class="r4 sm">${[['tk','ارسال سریع'],['cd','پرداخت در محل'],['sh','ضمانت اصالت کالا'],['us','پشتیبانی']].map(([i,t])=>`<span class="bx">${ic(i,22,'#e8b45a')}<small>${t}</small></span>`).join('')}</div><div class="bx2"><div style="display:flex;justify-content:space-between"><span>آدرس فروشگاه<br><small>${esc(s.address)}</small></span>${ic('pi',22,'#e8b45a')}</div><a class="ln" style="display:block" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">مشاهده در نقشه</a></div>${nav(2)}`},
home:()=>`<div class="tp"><a href="#/cart" aria-label="سبد خرید" style="position:relative">${ic('ca',22)}${cart.length?`<b style="position:absolute;top:-6px;right:-8px;background:#e8b45a;color:#16110a;border-radius:9px;font-size:10px;padding:0 5px">${cart.length}</b>`:''}</a>${logo(.5)}${ic('se',22)}</div><div class="in">${ic('se',18)}<input id="q" placeholder="جستجوی محصول ، مدل یا دسته..." style="border:0;background:none;padding:0" onkeydown="if(event.key==='Enter')location.hash='#/list/all/'+encodeURIComponent(this.value)"></div>${chips([['#/list/all','همه'],...D.categories.slice(0,3).map(c=>['#/list/'+c.id,c.name])],0)}<div class="bn"><img src="${esc(D.shop.banner)}" alt="" style="width:46%;height:100%;object-fit:cover"><div><b>کلکسیون پاییز و زمستان</b><small class="mu">استایل گرم ، کیفیت ماندگار</small><a href="#/list/men" class="gb sm2">مشاهده محصولات</a></div></div><h3>دسته‌بندی‌ها</h3><div class="g3">${D.categories.map(c=>`<a class="ca" href="#/list/${esc(c.id)}"><img src="${esc(c.image)}" alt="" style="width:100%;height:100%;object-fit:cover"><b>${esc(c.name)}</b></a>`).join('')}</div>${nav(0)}`,
list:(a='all',q='')=>{q=decodeURIComponent(q);const l=D.products.filter(p=>p.published&&(a=='all'||p.category==a)&&(!q||p.name.includes(q)));const cn=(D.categories.find(c=>c.id==a)||{name:'همه محصولات'}).name;return `${top(cn,ic('se',22))}${chips([['#/list/all','همه'],...D.categories.map(c=>['#/list/'+c.id,c.name])],a=='all'?0:D.categories.findIndex(c=>c.id==a)+1)}<div class="g2">${l.map(pc).join('')||'<p style="grid-column:1/-1">محصولی پیدا نشد.</p>'}</div>${nav(1)}`},
p:id=>{const p=D.products.find(x=>x.id==id);if(!p)return top('محصول')+'<p class="ct">محصول پیدا نشد.</p>';const T=[p.desc,p.specs||'—','۱ نظر • امتیاز ۴.۸'];return `<div class="hero" style="height:290px;position:relative"><img src="${esc(p.hero||p.image)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover"><a class="ab r" href="javascript:history.back()" aria-label="بازگشت">${ic('cr',20)}</a><span class="ab l">${ic('he',20)}</span></div><div class="pd"><h2>${esc(p.name)}</h2><div style="display:flex;justify-content:space-between"><b class="go">${money(p.price)}</b><small class="go">★★★★★ ۴.۸ (۱ نظر)</small></div><p>رنگ:</p><div class="dt">${(p.colors||[]).map((c,i)=>`<i data-a="col" data-i="${i}" style="background:${esc(c)};border-color:${i==sel.c?'#e8b45a':'#444'};cursor:pointer"></i>`).join('')}</div><p>سایز:</p><div class="chs" style="padding:0">${(p.sizes||[]).map((s,i)=>`<span data-a="siz" data-i="${i}" class="${i==sel.s?'g':''}" style="cursor:pointer">${esc(s)}</span>`).join('')}</div><button class="gb" data-a="add" data-id="${esc(p.id)}">افزودن به سبد خرید ${ic('ca',18)}</button><div class="r3"><span>${ic('he',18)}علاقه‌مندی</span><span>${ic('cm',18)}مقایسه</span><span data-a="share" style="cursor:pointer">${ic('sr',18)}اشتراک‌گذاری</span></div><div class="tb">${['توضیحات','مشخصات','نظرات'].map((t,i)=>`<span data-a="tab" data-i="${i}" class="${i==sel.t?'on':''}" style="cursor:pointer">${t}</span>`).join('')}</div><small class="mu" style="line-height:1.9">${esc(T[sel.t])}</small></div>`},
cart:()=>{const rows=cart.map((c,i)=>{const p=D.products.find(x=>x.id==c.id)||{};return `<div class="rw"><div class="ct2"><a data-a="del" data-i="${i}" style="cursor:pointer" aria-label="حذف">${ic('x',16)}</a><b>${esc(p.name)}</b><small>${money(p.price)}</small><span class="qt"><a data-a="dec" data-i="${i}" style="cursor:pointer">−</a>&nbsp; ${c.qty.toLocaleString('fa-IR')} &nbsp;<a data-a="inc" data-i="${i}" style="cursor:pointer">+</a></span></div><img src="${esc(p.image)}" alt="" style="width:84px;height:100px;border-radius:10px;object-fit:cover"></div>`}).join('');const tot=cart.reduce((s,c)=>s+c.qty*((D.products.find(x=>x.id==c.id)||{}).price||0),0);return `${top('سبد خرید',ic('x',22))}${rows||'<p class="ct" style="margin:40px 0">سبد خرید خالی است.<br><a class="go" href="#/list/all">دیدن محصولات</a></p>'}${cart.length?`<div class="tt"><span>جمع کل</span><b>${money(tot)}</b></div><button class="gb" data-a="out" style="margin:0 16px">تکمیل خرید</button>`:''}<div class="g2" style="margin-top:24px"><div class="bx2 ct">${ic('tk',28,'#e8b45a')}<br>ارسال سریع<br><small>۲ تا ۳ روز کاری</small></div><div class="bx2 ct">${ic('cd',28,'#e8b45a')}<br>پرداخت در محل<br><small>(در شهر تهران)</small></div></div>`}
};
function draw(){const [,v='splash',a,b]=(location.hash||'#/').slice(1).split('/');const f=V[v||'splash']||V.splash;app.innerHTML=f(a,b);scrollTo(0,0)}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
if(a=='col'){sel.c=i;draw()}else if(a=='siz'){sel.s=i;draw()}else if(a=='tab'){sel.t=i;draw()}
else if(a=='add'){const p=D.products.find(x=>x.id==t.dataset.id),k=cart.find(c=>c.id==p.id&&c.color==sel.c&&c.size==sel.s);k?k.qty++:cart.push({id:p.id,qty:1,color:sel.c,size:sel.s});$c();location.hash='#/cart'}
else if(a=='inc'){cart[i].qty++;$c();draw()}else if(a=='dec'){if(--cart[i].qty<1)cart.splice(i,1);$c();draw()}else if(a=='del'){cart.splice(i,1);$c();draw()}
else if(a=='share'){const u=location.href;navigator.share?navigator.share({title:D.shop.name,url:u}):navigator.clipboard.writeText(u)}
else if(a=='vc'){const s=D.shop,l=document.createElement('a');l.href=URL.createObjectURL(new Blob([`BEGIN:VCARD\nVERSION:3.0\nFN:${s.name}\nTEL:${s.phone}\nADR:;;${s.address};;;;\nEND:VCARD`],{type:'text/vcard'}));l.download='contact.vcf';l.click()}
else if(a=='out'){const who=prompt('نام و شماره تماس شما؟');if(!who)return;D=await load();const items=cart.map(c=>{const p=D.products.find(x=>x.id==c.id);return{id:c.id,name:p.name,qty:c.qty,price:p.price}}),tot=items.reduce((s,x)=>s+x.qty*x.price,0),o={id:'#'+(1000+D.orders.length+1),date:new Date().toLocaleString('fa-IR'),items,total:tot,status:'new',customer:who,img:(D.products.find(x=>x.id==items[0].id)||{}).image};D.orders.unshift(o);save(D);const msg=`سفارش ${o.id} از ${who}\n`+items.map(x=>`${x.name} × ${x.qty}`).join('\n')+`\nجمع: ${money(tot)}`;cart=[];$c();open(wa(msg),'_blank');location.hash='#/home'}});
addEventListener('hashchange',()=>{if(D)draw()});
load().then(d=>{D=d;draw()}).catch(()=>app.innerHTML='<p class="box" style="padding:20px">data.json پیدا نشد. فایل‌ها را با یک وب‌سرور باز کنید.</p>');
</script>
</body>
</html>
