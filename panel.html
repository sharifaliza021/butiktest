<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت ایران ویر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell"><aside class="sb" id="sb"></aside><main class="main" id="mn"></main></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<input type="file" id="file" hidden>
<script src="common.js"></script>
<script>
let D,sec='products',pg=0,q='';const $=s=>document.querySelector(s),PER=5;
const SEC=[['dash','داشبورد','gr'],['products','محصولات','dc'],['cats','دسته‌بندی‌ها','li'],['orders','سفارشات','ca'],['settings','تنظیمات','st']];
const ST={new:['جدید','#2f6fb5'],proc:['در حال پردازش','#4a90c8'],done:['تحویل شده','#2f8f55']};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1700)};
const commit=m=>{save(D);toast(m||'ذخیره شد');draw()};
const th=s=>s?`<img src="${esc(s)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`:'<i style="display:block;width:44px;height:44px;border-radius:8px;background:#222"></i>';
const cn=id=>(D.categories.find(c=>c.id==id)||{}).name||'-';
const fields=[['name','نام فروشگاه'],['desc','توضیح کوتاه'],['tagline','شعار'],['phone','شماره تماس'],['whatsapp','واتساپ (مثلاً 989120000000)'],['telegram','آیدی تلگرام'],['instagram','آیدی اینستاگرام'],['address','آدرس'],['mapUrl','لینک نقشه'],['cover','تصویر سردر (آدرس)'],['banner','تصویر بنر (آدرس)']];
function draw(){
 $('#sb').innerHTML=logo(.6)+SEC.map(([k,t,i])=>`<span data-a="sec" data-k="${k}" class="${k==sec?'on':''}">${ic(i,20)}${t}</span>`).join('')+`<span class="out" style="margin-top:auto" data-a="home">${ic('lo',20)}صفحه مشتری</span>`;
 const m=$('#mn');
 if(sec=='dash'){const rev=D.orders.reduce((s,o)=>s+o.total,0);m.innerHTML=`<h2>داشبورد</h2><div class="g2" style="padding:0;margin-top:14px">${[['محصولات',D.products.length],['سفارشات',D.orders.length],['سفارش جدید',D.orders.filter(o=>o.status=='new').length],['جمع فروش',money(rev)]].map(([a,b])=>`<div class="card2"><small class="mu">${a}</small><h2 class="go">${typeof b=='number'?b.toLocaleString('fa-IR'):b}</h2></div>`).join('')}</div>`}
 else if(sec=='products'){const l=D.products.filter(p=>p.name.includes(q)),n=Math.max(1,Math.ceil(l.length/PER));pg=Math.min(pg,n-1);m.innerHTML=`<h2>مدیریت محصولات</h2><div style="display:flex;gap:8px;margin:12px 0"><button class="gb sm2" style="margin:0;white-space:nowrap" data-a="new">افزودن محصول +</button><input id="q" value="${esc(q)}" placeholder="جستجوی محصولات..."></div><div class="tbl"><div class="rw2 hd"><span style="width:44px">تصویر</span><span style="flex:1">نام محصول</span><span style="width:90px">قیمت</span><span style="width:80px">وضعیت</span><span style="width:70px">عملیات</span></div>${l.slice(pg*PER,pg*PER+PER).map(p=>`<div class="rw2">${th(p.image)}<span style="flex:1">${esc(p.name)}<br><small class="mu">${esc(cn(p.category))}</small></span><span style="width:90px">${Number(p.price).toLocaleString('fa-IR')}</span><span class="${p.published?'ok':'mu'}" style="width:80px">${p.published?'منتشر شده':'پیش‌نویس'}</span><span style="width:70px;display:flex;gap:4px"><i class="ib" data-a="ed" data-id="${esc(p.id)}" style="cursor:pointer" aria-label="ویرایش">${ic('ed',14)}</i><i class="ib del" data-a="rm" data-id="${esc(p.id)}" style="cursor:pointer" aria-label="حذف">${ic('tr',14)}</i></span></div>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#b9b2a3"><span>نمایش ${(l.length?pg*PER+1:0).toLocaleString('fa-IR')} تا ${Math.min(l.length,pg*PER+PER).toLocaleString('fa-IR')} از ${l.length.toLocaleString('fa-IR')}</span><span><a data-a="pg" data-i="${pg+1}" style="cursor:pointer">‹</a> <b class="g" style="padding:2px 9px;border-radius:6px">${(pg+1).toLocaleString('fa-IR')}</b> <a data-a="pg" data-i="${pg-1}" style="cursor:pointer">›</a></span></div>`;
  const qi=$('#q');qi.oninput=e=>{q=e.target.value;pg=0;draw();$('#q').focus();$('#q').setSelectionRange(q.length,q.length)}}
 else if(sec=='cats'){m.innerHTML=`<h2>دسته‌بندی‌ها</h2><div style="margin-top:12px">${D.categories.map((c,i)=>`<div class="card2" style="display:flex;gap:8px;align-items:center">${th(c.image)}<input data-f="cn" data-i="${i}" value="${esc(c.name)}" aria-label="نام"><input data-f="ci" data-i="${i}" value="${esc(c.image)}" aria-label="تصویر"><button class="btn2 del" data-a="cx" data-i="${i}">حذف</button></div>`).join('')}</div><button class="gb sm2" data-a="cn">+ دسته جدید</button>`}
 else if(sec=='orders'){m.innerHTML=`<h2>سفارشات</h2><div style="margin-top:12px">${D.orders.map((o,i)=>`<div class="card2" style="display:flex;gap:12px;align-items:center">${o.img?`<img src="${esc(o.img)}" alt="" style="width:70px;height:70px;border-radius:10px;object-fit:cover">`:''}<div style="flex:1"><b>${esc(o.id)}</b> <small class="mu">${esc(o.date)}</small><br><small>${o.items.map(x=>esc(x.name)+' × '+x.qty).join('، ')}</small><br><small class="mu">${esc(o.customer||'')}</small> <b class="go">${money(o.total)}</b></div><select data-f="os" data-i="${i}" style="width:auto">${Object.entries(ST).map(([k,[t]])=>`<option value="${k}" ${k==o.status?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')||'<p>سفارشی ثبت نشده است.</p>'}</div>`}
 else{m.innerHTML=`<h2>تنظیمات فروشگاه</h2><div class="row" style="flex-wrap:wrap">${fields.map(([k,l])=>`<div style="flex:1 1 260px"><label for="f_${k}">${l}</label><input id="f_${k}" data-f="s" data-k="${k}" value="${esc(D.shop[k])}"></div>`).join('')}</div><div class="row" style="margin-top:20px"><button class="btn2" data-a="exp">دانلود data.json</button><button class="btn2" data-a="imp">بارگذاری json</button><button class="btn2 del" data-a="rst">بازگشت به data.json</button></div>`}
}
function ed(id){const p=D.products.find(x=>x.id==id)||{id:'p'+Date.now(),name:'',price:0,category:(D.categories[0]||{}).id,desc:'',image:'',hero:'',colors:['#111111'],sizes:['M','L','XL'],specs:'',published:true,n:1};const d=$('#dlg');
 d.innerHTML=`<h2>${p.n?'افزودن':'ویرایش'} محصول</h2><label for="n">نام محصول</label><input id="n" value="${esc(p.name)}"><div class="row"><div><label for="pr">قیمت (تومان)</label><input id="pr" type="number" min="0" value="${esc(p.price)}"></div><div><label for="ct">دسته‌بندی</label><select id="ct">${D.categories.map(c=>`<option value="${esc(c.id)}" ${c.id==p.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><label for="ds">توضیحات</label><textarea id="ds" rows="3">${esc(p.desc)}</textarea><label for="im">آدرس تصویر</label><input id="im" value="${p.image&&p.image.startsWith('data:')?'':esc(p.image)}"><input id="up" type="file" accept="image/*" style="margin-top:6px"><div class="row"><div><label for="co">رنگ‌ها (کد هگز با ویرگول)</label><input id="co" value="${esc((p.colors||[]).join(','))}"></div><div><label for="sz">سایزها</label><input id="sz" value="${esc((p.sizes||[]).join(','))}"></div></div><label for="sp">مشخصات</label><input id="sp" value="${esc(p.specs)}"><label><input id="pb" type="checkbox" style="width:auto" ${p.published?'checked':''}> منتشر شده</label><div class="row"><button class="gb" id="ok">ذخیره محصول</button><button class="btn2" id="no">انصراف</button></div>`;
 let img=p.image;$('#up').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;toast('تصویر آماده شد')};r.readAsDataURL(f)};
 $('#no').onclick=()=>d.close();
 $('#ok').onclick=()=>{if(!$('#n').value.trim())return toast('نام محصول لازم است');const sp=s=>s.split(',').map(x=>x.trim()).filter(Boolean);const o={...p,name:$('#n').value.trim(),price:Number($('#pr').value)||0,category:$('#ct').value,desc:$('#ds').value,image:$('#im').value||img||'',colors:sp($('#co').value),sizes:sp($('#sz').value),specs:$('#sp').value,published:$('#pb').checked};delete o.n;const i=D.products.findIndex(x=>x.id==p.id);i<0?D.products.unshift(o):D.products[i]=o;d.close();commit()};d.showModal()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,id=t.dataset.id;
 if(a=='sec'){sec=t.dataset.k;pg=0;draw()}else if(a=='home')location.href='index.html#/home'
 else if(a=='new')ed();else if(a=='ed')ed(id);else if(a=='rm'){if(confirm('این محصول حذف شود؟')){D.products=D.products.filter(p=>p.id!=id);commit()}}
 else if(a=='pg'){pg=Math.max(0,i);draw()}
 else if(a=='cn'){D.categories.push({id:'c'+Date.now(),name:'دسته جدید',image:''});commit()}else if(a=='cx'){D.categories.splice(i,1);commit()}
 else if(a=='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));l.download='data.json';l.click()}
 else if(a=='imp')$('#file').click();
 else if(a=='rst'){if(confirm('تغییرات ذخیره‌شده پاک و data.json دوباره خوانده شود؟')){localStorage.removeItem(KEY);const r=await fetch('data.json');D=await r.json();draw()}}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;if(f=='s')D.shop[t.dataset.k]=t.value;else if(f=='cn')D.categories[t.dataset.i].name=t.value;else if(f=='ci')D.categories[t.dataset.i].image=t.value;save(D)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f=='os'){D.orders[t.dataset.i].status=t.value;commit('وضعیت سفارش ذخیره شد')}});
$('#file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(x=>{try{D=JSON.parse(x);commit('بارگذاری شد')}catch(_){toast('فایل json معتبر نیست')}})};
load().then(d=>{D=d;draw()}).catch(()=>$('#mn').textContent='data.json پیدا نشد. فایل‌ها را با یک وب‌سرور باز کنید.');
</script>
</body>
</html>
